type CoffeeService {
  id: ID
  name: String
  roaster: Roaster
  locations: [CoffeeServiceLocation!]

  menu: [MenuItem]!
}

type CoffeeServiceLocation {
  name: String
  description: String
  location: Location

  dateOpened: String
  dateClosed: String
}

type MenuItem {
  name: String
  service: CoffeeService!

  variants: [String]!
  dateAdded: String
  dateRemoved: String
  details: JSON
}
