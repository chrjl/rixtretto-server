[project]
name = "rixtretto-server"
version = "0.0.0"
requires-python = ">= 3.15"
dependencies = [
  "python-dotenv >= 1.2.4",
  "sqlalchemy >= 2.1.3",
  "psycopg2-binary >= 2.9.13",
  "ariadne >= 1.1.1",
  "starlette >= 1.7.0",
  "uvicorn >= 0.54.0",
  "unidecode >= 1.4.0",
  "pydantic >= 2.14.1"
]
readme = "README.md"

[project.optional-dependencies]
dev = [
  "alembic >= 1.20.0",
  "pytest >= 9.1.1",
  "watchfiles >= 1.3.0",
  "httpx2 >= 2.13.1",
]

[tool.pytest]
addopts = ["-s"]
markers = [
  "echo: mark test engine fixture to echo sql output",
  "use_sample_data: seed sample data into test engine fixture",
]

[project.scripts]
serve-dev = "server:dev"
start = "server:serve"
